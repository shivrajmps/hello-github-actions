      g[0].setAttribute("d", hwLine(60, 160, 350, 40, 1) + " " + hwLine(350, 40, 640, 160, 2).replace("M", "L") + " " + hwLine(640, 160, 60, 160, 3).replace("M", "L"));

      tl.fromTo("#bank-mini-t", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, T.compare);
      hwDrawOn(tl, "#bank-mini-a", T.compare + 0.4, 0.6);
      // checklist: each item: wobbly box draws, then text, then green tick on cue
      const items = ["c1", "c2", "c3", "c4", "c5", "c6"]; const cues = [T.principal, T.apply, T.floating, T.tenure, T.fixed, T.flex];
      tl.fromTo("#bank-title", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.3 }, T.compare + 1.0);
      items.forEach((id, i) => {
        const ps = document.querySelectorAll("#bank-" + id + " path");
        ps[0].setAttribute("d", hwRect(8, 8, 48, 48, 20 + i)); ps[1].setAttribute("d", "M 14 34 L 28 48 L 54 14");

        hwDrawOn(tl, ps[0], cues[i], 0.35); hwDrawOn(tl, ps[1], cues[i] + 0.9, 0.3);
      });
